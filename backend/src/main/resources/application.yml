server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

spring:
  application:
    name: ai-video-generator
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 410MB

app:
  storage:
    root: ${APP_STORAGE_ROOT:../data}

runway:
  api-key: ${RUNWAYML_API_SECRET:}

management:
  endpoints:
    enabled-by-default: false
